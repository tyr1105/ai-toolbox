@media(max-width:500px){.features{grid-template-columns:1fr}.row{flex-direction:column}}
</style>

<body>

<div class="modal" id="modal">
  <div class="modal-inner">
    <h3>⚙️ API设置</h3>
    <p>使用DeepSeek API（注册即送500万tokens，够用很久）<br>
    <a href="https://platform.deepseek.com/" target="_blank" style="color:#667eea">去注册 →</a></p>
    <input id="keyInput" type="password" placeholder="输入你的DeepSeek API Key">
    <button class="save" onclick="saveKey()">保存</button>
  </div>
</div>
<script>
const TYPES=[
  {id:'knowledge',label:'知识科普',icon:'📚'},
  {id:'life',label:'生活日常',icon:'🏡'},
  {id:'food',label:'美食探店',icon:'🍜'},
  {id:'travel',label:'旅行攻略',icon:'✈️'},
  {id:'fitness',label:'健身运动',icon:'💪'},
  {id:'beauty',label:'美妆穿搭',icon:'💄'},
  {id:'tech',label:'数码科技',icon:'📱'},
  {id:'emotion',label:'情感心理',icon:'💝'},
  {id:'finance',label:'理财赚钱',icon:'💰'},
  {id:'pet',label:'萌宠',icon:'🐱'},
  {id:'parenting',label:'育儿教育',icon:'👶'},
  {id:'workplace',label:'职场技能',icon:'💼'},
];
const STYLE_DESC={humor:'搞笑幽默，用段子和梗让观众笑',professional:'专业干货，用数据和案例说话',emotional:'走心感动，用故事和金句打动人',suspense:'悬疑反转，用悬念和意外抓住注意力',energetic:'元气满满，用热情和活力感染人',storytelling:'讲故事，用叙事结构引人入胜'};
let curType='knowledge',apiKey=localStorage.getItem('ds_key')||'',curResult=null;
const typesEl=document.getElementById('types');
TYPES.forEach((t,i)=>{const d=document.createElement('div');d.className='chip'+(i===0?' active':'');d.innerHTML=t.icon+' '+t.label;d.onclick=()=>{document.querySelectorAll('#types .chip').forEach(c=>c.classList.remove('active'));d.classList.add('active');curType=t.id;};typesEl.appendChild(d);});
function toggleModal(){const m=document.getElementById('modal');m.classList.toggle('show');if(m.classList.contains('show'))document.getElementById('keyInput').value=apiKey;}
function saveKey(){apiKey=document.getElementById('keyInput').value.trim();localStorage.setItem('ds_key',apiKey);toggleModal();}
function showError(msg){const e=document.getElementById('error');e.textContent=msg;e.style.display='block';}
function hideError(){document.getElementById('error').style.display='none';}
function showResult(r){document.getElementById('resHook').textContent=r.hook||'';document.getElementById('resScript').textContent=r.script||'';document.getElementById('resShoot').textContent=r.shootingTips||'';document.getElementById('resBgm').textContent=r.bgmRecommend||'';document.getElementById('resCaption').textContent=r.caption||'';document.getElementById('resTips').textContent=r.viralTips||'';document.getElementById('result').classList.add('show');document.getElementById('features').style.display='none';}
function hideResult(){document.getElementById('result').classList.remove('show');}
function copy(field){if(!curResult)return;navigator.clipboard.writeText(curResult[field]||'').then(()=>{event.target.textContent='已复制✓';event.target.classList.add('ok');setTimeout(()=>{event.target.textContent='复制';event.target.classList.remove('ok');},1500);});}
function copyAll(){if(!curResult)return;const all='【开场钩子】\n'+curResult.hook+'\n\n【完整脚本】\n'+curResult.script+'\n\n【拍摄建议】\n'+curResult.shootingTips+'\n\n【BGM推荐】\n'+curResult.bgmRecommend+'\n\n【文案/字幕】\n'+curResult.caption+'\n\n【爆款提示】\n'+curResult.viralTips;navigator.clipboard.writeText(all).then(()=>alert('已复制全部脚本！'));}
async function generate(){
  const topic=document.getElementById('topic').value.trim();
  if(!topic)return showError('请输入视频主题');
  if(!apiKey){toggleModal();return showError('请先配置API Key（免费注册即送500万tokens）');}
  const dur=document.getElementById('duration').value,sty=document.getElementById('style').value,extra=document.getElementById('extra').value.trim(),typeObj=TYPES.find(t=>t.id===curType);
  const btn=document.getElementById('genBtn');btn.disabled=true;btn.innerHTML='<span class="spin">⏳</span> AI创作中...';hideError();hideResult();
  const sys='你是顶级短视频脚本编导，擅长创作抖音/快手/视频号爆款脚本。\n核心能力：\n1. 开场3秒钩子必须足够抓人（用数据、反常识、提问、制造冲突等方式）\n2. 脚本节奏紧凑，每5-8秒一个信息点或情绪转折\n3. 结尾必须有强烈的行动号召（点赞/关注/评论）\n4. 语言口语化，避免书面语\n5. 善用emoji和网感表达';
  const usr='请为以下短视频生成完整脚本：\n\n视频类型：'+typeObj.label+'\n主题：'+topic+'\n时长：'+dur+'秒\n风格：'+STYLE_DESC[sty]+'\n'+(extra?'补充要求：'+extra:'')+'\n\n请严格按以下JSON格式返回：\n{"hook":"开场钩子（前3秒说什么/做什么，要有强烈的吸引力）","script":"完整分镜脚本（按时间线，标注画面+台词+动作）","shootingTips":"拍摄建议（镜头角度、光线、道具、场景选择等3-5条）","bgmRecommend":"BGM推荐（2-3首适合的背景音乐，说明为什么适合）","caption":"发布文案（标题+正文+热门话题标签，可直接复制发布）","viralTips":"爆款运营建议（发布时间、互动引导、评论区运营等3条）"}';
  try{
    const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.85,max_tokens:3000})});
    if(!res.ok)throw new Error('API错误: '+res.status);
    const data=await res.json();const c=data.choices?.[0]?.message?.content||'';let p;
    try{const m=c.match(/\{[\s\S]*\}/);if(m)p=JSON.parse(m[0]);}catch(e){}
    if(!p?.hook){p={hook:'今天我要告诉你一个秘密...',script:c,shootingTips:'竖屏拍摄，光线充足，背景简洁',bgmRecommend:'热门卡点音乐',caption:topic+' #短视频 #干货',viralTips:'晚8点发布，评论区引导互动'};}
    curResult=p;showResult(p);
  }catch(e){showError(e.message);}finally{btn.disabled=false;btn.innerHTML='🚀 生成脚本';}
}
</script>
</body>
